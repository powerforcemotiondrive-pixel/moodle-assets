<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSEA Semester 1 - Module 1: Travel & Transport</title>
  <!-- Tailwind CSS CLI Output -->
  <link rel="stylesheet" href="https://powerforcemotiondrive-pixel.github.io/moodle-assets/output.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

  <!-- Custom Tailwind adjustments for Warm Editorial / Terracotta & Oat theme -->
  <div class="w-[98%] sm:w-[95%] lg:w-[90%] max-w-[1350px] mx-auto px-2 sm:px-4 py-3 font-sans">
    <!-- Main Deck Container -->
    <div class="moodle-deck-canvas bg-white rounded-2xl shadow-2xl border border-slate-300 flex flex-col overflow-hidden">
      
      <!-- Header bar -->
      <header class="bg-[#b85d42] text-white px-4 py-4 sm:px-6 sm:py-5 flex flex-wrap items-center justify-between gap-3 border-b border-[#9e4e37] shrink-0 relative overflow-hidden" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255, 255, 255, 0.03) 10px, rgba(255, 255, 255, 0.03) 20px);">
        <div class="flex items-center space-x-3 sm:space-x-4">
          <div class="bg-[#c29b38] p-2.5 rounded-lg text-white shadow-md flex items-center justify-center">
            <!-- Terracotta Theme Icon -->
            <svg width="20" height="20" style="width: 20px; height: 20px;" class="w-5 h-5 text-white shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
          </div>
          <div>
            <span class="block text-xs sm:text-sm md:text-base font-black tracking-wider text-[#fde047] uppercase">GSEA SEMESTER 1 - MODULE 1: TRAVEL &amp; TRANSPORT (2)</span>
            <h1 id="deck-title" class="text-sm sm:text-base font-bold text-white mt-0.5">Loading Module...</h1>
          </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex items-center space-x-2">
          <span id="counter-badge" class="text-xs font-medium text-white bg-[#9e4e37] px-2.5 py-1 rounded-md border border-[#853f2c] mr-1 shadow-md">1 of 7</span>
          <button id="prev-btn" class="flex items-center space-x-1 bg-[#9e4e37] hover:bg-[#853f2c] active:bg-[#6e3222] text-slate-100 px-3 py-1.5 rounded-lg font-semibold text-xs transition-all border border-[#853f2c] disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer shadow-md" type="button">
            <span class="pointer-events-none">Previous</span>
          </button>
          <button id="next-btn" class="flex items-center space-x-1 bg-[#c29b38] hover:bg-[#a8842c] active:bg-[#8f6e21] text-white px-3 py-1.5 rounded-lg font-semibold text-xs transition-all shadow-md disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer" type="button">
            <span class="pointer-events-none">Next</span>
          </button>
        </div>
      </header>

      <!-- Workspace Body -->
      <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <!-- Sidebar Directory -->
        <div class="w-full md:w-64 bg-slate-50 border-r border-slate-200 flex flex-col shrink-0 max-h-32 md:max-h-none overflow-y-auto">
          <div class="p-2.5 bg-slate-200/70 border-b border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-600">
            Contents Menu
          </div>
          <div id="deck-menu" class="divide-y divide-slate-200">
            <!-- Populated via script -->
          </div>
        </div>

        <!-- Main Content Panel Area -->
        <div class="flex-1 bg-white p-4 sm:p-6 flex flex-col justify-between overflow-y-auto">
          <!-- Content Card Details with Borderless Image Option -->
          <div class="space-y-4">
            <div class="flex flex-col lg:flex-row gap-4 items-start justify-between">
              <div class="space-y-3 flex-1">
                <!-- Restyled larger terracotta badge -->
                <div class="inline-flex items-center space-x-2 bg-[#b85d42] text-white px-3.5 py-1 rounded-full text-xs font-black tracking-wide border border-[#9e4e37] shadow-sm">
                  <span id="card-tag">Section 1</span>
                </div>
                <h2 id="card-heading" class="text-lg sm:text-xl font-black text-[#b85d42] tracking-tight"></h2>
                <div id="card-desc" class="text-xs sm:text-sm text-slate-600 leading-relaxed space-y-2"></div>
              </div>
              <!-- Image Container with Subtle Drop Shadow -->
              <div id="image-container" class="w-full sm:w-48 h-48 rounded-xl shrink-0 overflow-hidden shadow-md hidden" style="box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);">
                <img id="card-image" class="w-full h-full object-cover" alt="Module graphic">
              </div>
            </div>

            <!-- Stylized Skills Footer Area -->
            <div id="card-skills" class="w-full pt-3 pb-3 px-4 rounded-xl border border-slate-200/60 bg-slate-50/50 grid grid-cols-2 sm:grid-cols-4 gap-y-2.5 gap-x-4 shadow-sm"></div>
          </div>

          <!-- Action Link Footer Inside Card -->
          <div class="pt-4 border-t border-slate-100 flex flex-col items-start gap-2.5 mt-4">
            <div id="footer-instruction" class="text-[11px] text-slate-500 font-medium">Click below to open this specific page directly in your workspace tab.</div>
            <!-- Dynamic Action Links Container -->
            <div id="action-links-container" class="w-full flex flex-wrap items-center gap-2"></div>
          </div>
        </div>
      </div>

      <!-- Bottom status footer -->
      <footer class="bg-slate-50 border-t border-slate-200 px-3 py-2 text-[11px] text-slate-500 flex justify-between items-center shrink-0 rounded-b-2xl">
        <span id="footer-status" class="font-medium text-slate-700">Ready</span>
        <span class="font-medium">GSEA Semester 1 General English. Phil PARRIS LH/LAN</span>
      </footer>
    </div>
  </div>

  <!-- Script Configuration -->
  <script>
    const deckPages = [
      {
        tag: "Module 1 - Session 1",
        title: "Session 1 - Introduction & Travel Anecdote",
        description: "Welcome to our new module on Social Policy, Research and Innovation, and Environmental Management! In our interactive sessions, we will be working extensively on discussion, grammar correction, DDRS, and TOEIC-related exercises to build your professional proficiency.<br><br><em>Subject overview:</em> An introduction to travel and transport themes alongside personal travel anecdotes.<br><br>All our work this module builds progressively toward your Formative Evaluation in Session 5 (Design an eco-friendly holiday itinerary or compare two cities with different tourism policies), for which you will receive a GO / NO GO.",
        url: "session1/admat1.html",
        additionalMaterialsUrl: "session1/admat1.html",
        pdfUrl: "agmod1.pdf",
        lessonPlanUrl: "session1/plan1.html",
        objectivesUrl: "session1/obj1.html",
        classReviewUrl: "session1/rev1.html",
        imageUrl: "images/card1.png"
      },
      {
        tag: "Module 1 - Session 2",
        title: "Session 2 - Evolution of Transport",
        description: "Welcome back! Continuing our focus on Social Policy, Research, Innovation, and Environmental Management, we will be working on discussion, grammar correction, DDRS, and TOEIC-related exercises.<br><br><em>Subject overview:</em> Exploring how transport systems have evolved over time and their societal impacts.<br><br>All our work this module builds progressively toward your Formative Evaluation in Session 5 (Design an eco-friendly holiday itinerary or compare two cities with different tourism policies), for which you will receive a GO / NO GO.",
        url: "session2/admat1.html",
        additionalMaterialsUrl: "session2/admat1.html",
        pdfUrl: "agmod1.pdf",
        lessonPlanUrl: "session2/plan2.html",
        objectivesUrl: "session2/obj2.html",
        classReviewUrl: "session2/rev1.html",
        imageUrl: "images/card2.png"
      },
      {
        tag: "Module 1 - Session 3",
        title: "Session 3 - Overtourism",
        description: "Welcome to Session 3! In this class, we will be working on discussion, grammar correction, DDRS, and TOEIC-related exercises within the framework of Social Policy, Research and Innovation, and Environmental Management.<br><br><em>Subject overview:</em> Analyzing the environmental and social challenges brought by overtourism in popular destinations.<br><br>All our work this module builds progressively toward your Formative Evaluation in Session 5 (Design an eco-friendly holiday itinerary or compare two cities with different tourism policies), for which you will receive a GO / NO GO.",
        url: "https://e-campus.enac.fr/moodle/mod/page/view.php?id=266758",
        pdfUrl: "agmod1.pdf",
        lessonPlanUrl: "https://e-campus.enac.fr/moodle/mod/page/view.php?id=266897",
        objectivesUrl: "https://e-campus.enac.fr/moodle/mod/page/view.php?id=266889",
        classReviewUrl: "https://e-campus.enac.fr/moodle/mod/page/view.php?id=267460",
        imageUrl: "images/card3.png"
      },
      {
        tag: "Module 1 - Session 4",
        title: "Session 4 - Sustainable and Eco-tourism",
        description: "Welcome to Session 4! As we examine environmental management and green innovation, we will continue working on discussion, grammar correction, DDRS, and TOEIC-related exercises.<br><br><em>Subject overview:</em> Investigating sustainable practices, green innovation, and eco-friendly alternatives in modern tourism.<br><br>All our work this module builds progressively toward your Formative Evaluation in Session 5 (Design an eco-friendly holiday itinerary or compare two cities with different tourism policies), for which you will receive a GO / NO GO.",
        url: "https://e-campus.enac.fr/moodle/mod/page/view.php?id=266780",
        pdfUrl: "agmod1.pdf",
        lessonPlanUrl: "https://e-campus.enac.fr/moodle/mod/page/view.php?id=267455",
        objectivesUrl: "https://e-campus.enac.fr/moodle/mod/page/view.php?id=266891",
        classReviewUrl: "https://e-campus.enac.fr/moodle/mod/page/view.php?id=267462",
        imageUrl: "images/card4.png"
      },
      {
        tag: "Module 1 - Session 5",
        title: "Session 5 - Formative Evaluation",
        description: "Welcome to Session 5! Throughout this module, we have worked on discussion, grammar correction, DDRS, and TOEIC-related exercises.<br><br><em>Subject overview:</em> Formative Evaluation — Design an eco-friendly holiday itinerary or compare two cities with different tourism policies + Targets.<br><br>For this session's evaluation, you will receive a GO / NO GO based on your performance.",
        url: "https://e-campus.enac.fr/moodle/mod/page/view.php?id=266604",
        pdfUrl: "agmod1.pdf",
        lessonPlanUrl: "https://e-campus.enac.fr/moodle/mod/page/view.php?id=267409",
        objectivesUrl: "https://e-campus.enac.fr/moodle/mod/page/view.php?id=266887",
        imageUrl: "https://i.imgur.com/9h4JS6u.png"
      },
      {
        tag: "Module 1 - Focus",
        title: "DDRS - Framework & Core Principles",
        description: "<strong>Definition:</strong> DDRS (Développement Durable et Responsabilité Sociétale / Sustainable Development & Social Responsibility) is the guiding operational framework that integrates ecological protection, social equity, and ethical governance into modern corporate and public policy.<br><br><strong>Basic areas covered:</strong> Environmental preservation and carbon reduction, social wellbeing and community impact, and ethical business innovation.<br><br><strong>Importance of discussing these areas:</strong> Discussing DDRS topics is vital to equip future transport and aviation professionals with the critical thinking needed to balance continuous operational growth with long-term environmental and social sustainability.",
        detailsUrl: "ddrs.html",
        imageUrl: "https://i.imgur.com/AzH2ypU.png"
      }
    ];

    let currentIndex = 0;

    function initDeck() {
      if (deckPages.length === 0) return;

      document.getElementById('prev-btn').addEventListener('click', () => stepDeck(-1));
      document.getElementById('next-btn').addEventListener('click', () => stepDeck(1));

      // Enable keyboard navigation with left/right arrow keys
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') stepDeck(-1);
        if (e.key === 'ArrowRight') stepDeck(1);
      });

      // Hide image container on error to prevent broken image icons
      const imgEl = document.getElementById('card-image');
      const imageContainer = document.getElementById('image-container');
      if (imgEl && imageContainer) {
        imgEl.addEventListener('error', () => {
          imageContainer.classList.add('hidden');
        });
      }

      // Populate static skills badge container once
      const skillsEl = document.getElementById('card-skills');
      if (skillsEl) {
        skillsEl.innerHTML = `
          <div class="flex flex-col"><span class="text-sm font-black italic tracking-wide text-[#b85d42]">FLUENCY</span><span class="text-[8px] text-slate-400 font-mono">/ˈfluː.ən.si/</span></div>
          <div class="flex flex-col"><span class="text-xs font-bold uppercase text-[#c29b38]">Grammar</span><span class="text-[8px] text-slate-400 font-mono">/ˈɡræm.ər/</span></div>
          <div class="flex flex-col"><span class="text-[11px] font-extrabold normal-case text-slate-700 underline decoration-slate-300">DDRS & TOEIC</span><span class="text-[8px] text-slate-400 font-mono">/diː-diː-ɑː-ɛs & ˈtəʊ.ɪk/</span></div>
          <div class="flex flex-col"><span class="text-xs font-semibold italic text-[#9e4e37]">Pronunciation</span><span class="text-[8px] text-slate-400 font-mono">/prəˌnʌn.siˈeɪ.shən/</span></div>
          <div class="flex flex-col"><span class="text-xs font-bold uppercase tracking-wider text-teal-700">Comprehension</span><span class="text-[8px] text-slate-400 font-mono">/ˌkɒm.prɪˈhen.ʃən/</span></div>
          <div class="flex flex-col"><span class="text-sm font-black italic text-sky-700">Discussion</span><span class="text-[8px] text-slate-400 font-mono">/dɪˈskʌʃ.ən/</span></div>
          <div class="flex flex-col"><span class="text-xs font-extrabold uppercase text-rose-600">CORRECTION</span><span class="text-[8px] text-slate-400 font-mono">/kəˈrek.ʃən/</span></div>
          <div class="flex flex-col"><span class="text-[11px] font-extrabold tracking-widest text-[#c29b38]">GO / NO GO</span><span class="text-[8px] text-slate-400 font-mono">/ɡəʊ / nəʊ ɡəʊ/</span></div>
        `;
      }

      buildMenu();
      renderCard(0);
    }

    function buildMenu() {
      const menuEl = document.getElementById('deck-menu');
      menuEl.innerHTML = '';

      deckPages.forEach((page, idx) => {
        const item = document.createElement('button');
        item.type = 'button';
        item.innerHTML = `
          <span class="truncate pr-2 pointer-events-none">${page.title}</span>
          <span class="text-[10px] text-slate-400 font-mono pointer-events-none">0${idx + 1}</span>
        `;
        item.addEventListener('click', () => renderCard(idx));
        menuEl.appendChild(item);
      });
    }

    function updateMenu(activeIdx) {
      const menuEl = document.getElementById('deck-menu');
      const items = menuEl.querySelectorAll('button');
      items.forEach((item, idx) => {
        const isActive = idx === activeIdx;
        item.className = `w-full text-left px-3 py-2 text-xs font-medium transition-all flex items-center justify-between border-b border-slate-100 cursor-pointer ${
          isActive 
            ? 'bg-amber-50/80 text-[#b85d42] font-bold shadow-md shadow-slate-400/40' 
            : 'text-slate-700 hover:bg-slate-100'
        }`;
        item.style.borderLeft = isActive ? '4px solid #c29b38' : '4px solid transparent';
      });
    }

    function renderCard(idx) {
      if (idx < 0 || idx >= deckPages.length) return;
      currentIndex = idx;

      const page = deckPages[currentIndex];

      document.getElementById('card-tag').textContent = page.tag;
      document.getElementById('card-heading').textContent = page.title;
      document.getElementById('card-desc').innerHTML = page.description;

      const actionContainer = document.getElementById('action-links-container');
      const footerInstruction = document.getElementById('footer-instruction');
      actionContainer.innerHTML = '';

      if (page.detailsUrl) {
        footerInstruction.textContent = "Click below to view the official government DD&RS framework:";
        const detailsBtn = document.createElement('a');
        detailsBtn.className = "inline-flex items-center space-x-2 bg-[#b85d42] hover:bg-[#9e4e37] text-white px-3.5 py-2 rounded-lg text-xs font-bold shadow-md shadow-slate-400/40 transition-all cursor-pointer";
        detailsBtn.href = page.detailsUrl;
        detailsBtn.target = "_blank";
        detailsBtn.rel = "noopener noreferrer";
        detailsBtn.innerHTML = "<span>Details</span>";
        actionContainer.appendChild(detailsBtn);

        const imageContainer = document.getElementById('image-container');
        const imgEl = document.getElementById('card-image');

        if (page.imageUrl && page.imageUrl.trim() !== "") {
          imgEl.src = page.imageUrl;
          imageContainer.classList.remove('hidden');
        } else {
          imgEl.src = "";
          imageContainer.classList.add('hidden');
        }

        document.getElementById('counter-badge').textContent = `${currentIndex + 1} of ${deckPages.length}`;
        document.getElementById('deck-title').textContent = page.title;
        document.getElementById('footer-status').textContent = `Active: ${page.title}`;

        document.getElementById('prev-btn').disabled = (currentIndex === 0);
        document.getElementById('next-btn').disabled = (currentIndex === deckPages.length - 1);

        updateMenu(currentIndex);
        return;
      }

      footerInstruction.textContent = "Click below to open this specific page directly in your workspace tab.";

      const leftButtonsGroup = document.createElement('div');
      leftButtonsGroup.className = "flex flex-wrap items-center gap-2";

      if (page.lessonPlanUrl) {
        const btn = document.createElement('a');
        btn.className = "inline-flex items-center space-x-2 bg-[#b85d42] hover:bg-[#9e4e37] text-white px-3 py-2 rounded-lg text-xs font-bold shadow-md shadow-slate-400/40 transition-all";
        btn.href = page.lessonPlanUrl;
        btn.target = "_blank";
        btn.rel = "noopener noreferrer";
        btn.innerHTML = "<span>Lesson Plan</span>";
        leftButtonsGroup.appendChild(btn);
      }

      if (page.objectivesUrl) {
        const btn = document.createElement('a');
        btn.className = "inline-flex items-center space-x-2 bg-[#b85d42] hover:bg-[#9e4e37] text-white px-3 py-2 rounded-lg text-xs font-bold shadow-md shadow-slate-400/40 transition-all";
        btn.href = page.objectivesUrl;
        btn.target = "_blank";
        btn.rel = "noopener noreferrer";
        btn.innerHTML = "<span>Objectives</span>";
        leftButtonsGroup.appendChild(btn);
      }

      const materialsUrl = page.additionalMaterialsUrl || page.url;
      if (materialsUrl) {
        const btn = document.createElement('a');
        btn.className = "inline-flex items-center space-x-2 bg-[#b85d42] hover:bg-[#9e4e37] text-white px-3 py-2 rounded-lg text-xs font-bold shadow-md shadow-slate-400/40 transition-all";
        btn.href = materialsUrl;
        btn.target = "_blank";
        btn.rel = "noopener noreferrer";
        btn.innerHTML = "<span>Additional Materials</span>";
        leftButtonsGroup.appendChild(btn);
      }

      if (page.classReviewUrl && !page.classReviewUrl.includes("YOUR_REVIEW_ID")) {
        const reviewBtn = document.createElement('a');
        reviewBtn.className = "inline-flex items-center space-x-2 bg-[#b85d42] hover:bg-[#9e4e37] text-white px-3 py-2 rounded-lg text-xs font-bold shadow-md shadow-slate-400/40 transition-all";
        reviewBtn.href = page.classReviewUrl;
        reviewBtn.target = "_blank";
        reviewBtn.rel = "noopener noreferrer";
        reviewBtn.innerHTML = "<span>Revision</span>";
        leftButtonsGroup.appendChild(reviewBtn);
      }

      actionContainer.appendChild(leftButtonsGroup);

      if (page.pdfUrl && !page.pdfUrl.includes("INSERT_YOUR_PDF_LINK_HERE")) {
        const pdfBtn = document.createElement('a');
        pdfBtn.className = "inline-flex items-center space-x-2 bg-[#c29b38] hover:bg-[#a8842c] text-white px-3 py-2 rounded-lg text-xs font-bold shadow-md shadow-slate-400/40 transition-all ml-auto";
        pdfBtn.href = page.pdfUrl;
        pdfBtn.target = "_blank";
        pdfBtn.rel = "noopener noreferrer";
        pdfBtn.innerHTML = "<span>Worksheet</span>";
        actionContainer.appendChild(pdfBtn);
      }

      const imageContainer = document.getElementById('image-container');
      const imgEl = document.getElementById('card-image');

      if (page.imageUrl && page.imageUrl.trim() !== "") {
        imgEl.src = page.imageUrl;
        imageContainer.classList.remove('hidden');
      } else {
        imgEl.src = "";
        imageContainer.classList.add('hidden');
      }

      document.getElementById('counter-badge').textContent = `${currentIndex + 1} of ${deckPages.length}`;
      document.getElementById('deck-title').textContent = page.title;
      document.getElementById('footer-status').textContent = `Active: ${page.title}`;

      document.getElementById('prev-btn').disabled = (currentIndex === 0);
      document.getElementById('next-btn').disabled = (currentIndex === deckPages.length - 1);

      updateMenu(currentIndex);
    }

    function stepDeck(direction) {
      const newIndex = currentIndex + direction;
      if (newIndex >= 0 && newIndex < deckPages.length) {
        renderCard(newIndex);
      }
    }

    // Standard DOMContentLoaded listener properly calling initDeck()
    document.addEventListener('DOMContentLoaded', () => {
      initDeck();
    });
  </script>
</body>
</html>
